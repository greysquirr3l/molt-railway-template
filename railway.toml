# Railway.toml - Molt.bot Configuration

[build]
# Metal build system uses Dockerfile automatically
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/setup-system.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check - use port 8080 explicitly when TCP proxy is configured
healthcheckPath = "/healthz"
healthcheckTimeout = 100
# When using TCP proxy for SSH (port 22), the HTTP service runs on port 8080
# Railway should check HTTP health on 8080, not the TCP proxy port
